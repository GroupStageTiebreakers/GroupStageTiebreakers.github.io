<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Group Stage</title>
    <style>
      table
      {
          border-collapse: collapse;
      }
      th, td
      {
          border: 1px solid;
      }
    </style>
    <script>
      const NAMES = ["Team A", "Team B", "Team C", "Team D"];
      const N = NAMES.length;
      const HEADERS = ["W", "D", "L", "GF", "GA", "GD", "P", "R"];
      const SET = 3;
      const HOME = 0;
      const AWAY = 1;
      var table = document.createElement("TABLE");
      var tr = document.createElement("TR");
      var th = document.createElement("TH");
      var td = [{}];
      var teams = [{}];
      function calculate()
      {
          var i;
          var j;
          var fields = {};
          var field = "";
          var pattern = /^(|[1-9])\d$/;
          var home = 0;
          var away = 0;
          for (i = 0; i < N; i++)
          {
              fields.W = 0;
              fields.D = 0;
              fields.L = 0;
              fields.GF = 0;
              fields.GA = 0;
              for (j = 0; j < N; j++)
                  if (i !== j && pattern.test(teams[i][j][HOME]) && pattern.test(teams[i][j][AWAY]))
                  {
                      home = Number(teams[i][j][HOME]);
                      away = Number(teams[i][j][AWAY]);
                      if (home > away) fields.W++;
                      else if (home < away) fields.L++;
                      else fields.D++;
                      fields.GF += home;
                      fields.GA += away;
                  }
              fields.GD = fields.GF - fields.GA;
              fields.P = fields.W * 3 + fields.D;
              for (field in fields) teams[i][field].push(fields[field]);
          }
      }
      function output(row, column, text)
      {
          var i;
          var j;
          var k = 0;
          var header = "";
          td[row][column].innerText = text;
          for (i = 0; i < N; i++)
          {
              teams[i] = {};
              for (j = 0; j < N; j++)
              {
                  k = j * SET;
                  if (i < j) teams[i][j] = [td[i][k - 2].innerText, td[i][k].innerText];
                  else if (i > j) teams[i][j] = [td[i][k].innerText, td[i][k + 2].innerText];
              }
              for (header of HEADERS) teams[i][header] = [];
          }
          calculate();
          for (i = 0; i < N; i++)
              for (header of HEADERS) td[i][header].innerText = teams[i][header][0];
      }
    </script>
  </head>
  <body>
    <script>
      var k = 0;
      var header = "";
      var left = 0;
      var middle = 0;
      var right = 0;
      th.innerText = "Group";
      tr.appendChild(th);
      for (th = {}; k < N; k++)
      {
          th[k] = document.createElement("TH");
          th[k].colSpan = SET;
          th[k].innerText = NAMES[k];
          tr.appendChild(th[k]);
      }
      for (header of HEADERS)
      {
          th[header] = document.createElement("TH");
          th[header].innerText = header;
          tr.appendChild(th[header]);
      }
      table.appendChild(tr);
      for (let i = 0; i < N; i++)
      {
          tr = document.createElement("TR");
          td[i] = document.createElement("TD");
          td[i].innerText = NAMES[i];
          td[i].contentEditable = true;
          td[i].oninput = function()
                          {
                              th[i].innerText = this.innerText;
                          };
          tr.appendChild(td[i]);
          td[i] = {};
          for (let j = 0; j < N; j++)
          {
              k = j * SET;
              if (i === j)
              {
                  td[i][k] = document.createElement("TD");
                  td[i][k].colSpan = SET;
                  td[i][k].style.backgroundColor = "gray";
                  tr.appendChild(td[i][k]);
              }
              else
              {
                  if (i < j)
                  {
                      left = k - 2;
                      middle = k - 1;
                      right = k;
                      td[i][left] = document.createElement("TD");
                      td[i][right] = document.createElement("TD");
                  }
                  else
                  {
                      left = k;
                      middle = k + 1;
                      right = k + 2;
                      td[i][left] = document.createElement("TD");
                      td[i][left].contentEditable = true;
                      td[i][left].oninput = function()
                                              {
                                                  output(j, i * SET, this.innerText);
                                              };
                      td[i][right] = document.createElement("TD");
                      td[i][right].contentEditable = true;
                      td[i][right].oninput = function()
                                              {
                                                  output(j, i * SET - 2, this.innerText);
                                              };
                  }
                  td[i][left].style.borderRight = "none";
                  td[i][left].style.textAlign = "right";
                  tr.appendChild(td[i][left]);
                  td[i][middle] = document.createElement("TD");
                  td[i][middle].style.width = "1em";
                  td[i][middle].style.borderLeft = "none";
                  td[i][middle].style.borderRight = "none";
                  td[i][middle].style.textAlign = "center";
                  td[i][middle].innerText = ":";
                  tr.appendChild(td[i][middle]);
                  td[i][right].style.borderLeft = "none";
                  td[i][right].style.textAlign = "left";
                  tr.appendChild(td[i][right]);
              }
          }
          for (header of HEADERS)
          {
              td[i][header] = document.createElement("TD");
              td[i][header].style.textAlign = "center";
              tr.appendChild(td[i][header]);
          }
          td[i].R.contentEditable = true;
          table.appendChild(tr);
      }
      document.body.appendChild(table);
    </script>
  </body>
</html>
